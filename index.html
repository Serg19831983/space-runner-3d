<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CYBER RUNNER: APEX EDITION</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#03040a;font-family:'Segoe UI',Roboto,sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;width:100%;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:35}
.row{display:flex;gap:8px}
.pill{background:rgba(10,15,32,.85);border:1px solid rgba(0,243,255,.45);padding:6px 14px;border-radius:10px;backdrop-filter:blur(6px)}
.lbl{font-size:9px;color:#7a94c4;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.val{font-size:18px;font-weight:900;color:#fff}
.val.gold{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.4)}
.btns{display:flex;gap:8px;pointer-events:auto}
.ibtn{background:rgba(12,18,38,.9);border:1px solid #2b3d66;color:#00f3ff;width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#alerts{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:12;width:92%;max-width:340px}
.badge{font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 14px;border-radius:20px;background:rgba(6,12,26,.82);border:1px solid rgba(0,243,255,.35);color:#00f3ff;text-align:center}
#bossWrap{width:100%;background:rgba(25,5,15,.92);border:1px solid #ff0055;border-radius:8px;padding:6px 10px}
.bar-bg{width:100%;height:7px;background:#1a0610;border-radius:4px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;transition:width .1s}
#combatBar{position:fixed;bottom:18px;left:0;width:100%;padding:0 18px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:15}
.wcard{background:rgba(10,15,32,.88);border:1px solid #ff007f;border-radius:10px;padding:8px 12px;width:155px}
#fireBtn{pointer-events:auto;background:linear-gradient(135deg,#ff007f,#8800ff);border:2px solid #fff;color:#fff;padding:16px 26px;border-radius:50px;font-size:15px;font-weight:900;letter-spacing:1px;box-shadow:0 0 22px rgba(255,0,127,.65);cursor:pointer}
#fireBtn:active{transform:scale(.93)}
.screen{position:fixed;inset:0;background:radial-gradient(circle at center,rgba(16,22,48,.86),rgba(3,4,10,.96));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:30;backdrop-filter:blur(6px);overflow-y:auto}
.hidden{display:none!important}
.logo{font-size:clamp(32px,7vw,56px);font-weight:900;letter-spacing:3px;text-align:center;background:linear-gradient(90deg,#00f3ff,#ff007f,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{color:#8c9ec4;font-size:13px;text-align:center;margin-bottom:24px;max-width:440px;line-height:1.5}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.bmain{grid-column:1/-1;background:linear-gradient(45deg,#ff007f,#7000ff);color:#fff;border:none;padding:18px;border-radius:12px;font-size:20px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 0 25px rgba(255,0,127,.5);text-transform:uppercase}
.bsub{background:rgba(255,255,255,.06);border:1px solid #2b3d66;color:#00f3ff;padding:13px 8px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;text-transform:uppercase}
.panel{width:100%;max-width:700px;background:#0a0f22;border:1px solid #253559;border-radius:14px;padding:20px;max-height:82vh;overflow-y:auto}
.phead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1c2845;padding-bottom:12px;margin-bottom:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px}
.card{background:#0f1630;border:1px solid #1e2c4d;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.card.active{border-color:#00f3ff;box-shadow:0 0 12px rgba(0,243,255,.25)}
.bsm{width:100%;padding:8px;border:none;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;margin-top:10px;text-transform:uppercase}
</style>
<script src="https://cloudflare.com"></script>
</head>
<body tabindex="0">
<div id="hud">
  <div class="row">
    <div class="pill"><div class="lbl">Дистанция</div><div class="val" id="uiDist">0 м</div></div>
    <div class="pill"><div class="lbl">Кредиты</div><div class="val gold" id="uiCoins">0</div></div>
  </div>
  <div class="btns">
    <button class="ibtn" id="btnSound">🔊</button>
    <button class="ibtn hidden" id="btnPause">⏸</button>
  </div>
</div>
<div id="alerts" class="hidden">
  <div class="badge" id="secBadge">СЕКТОР 01: НЕОНОВЫЙ ГОРОД</div>
  <div class="badge hidden" id="cmbBadge" style="border-color:#ffd700;color:#ffd700">🔥 КОМБО x1</div>
  <div class="badge hidden" id="bufBadge" style="border-color:#00ff88;color:#00ff88"></div>
  <div id="bossWrap" class="hidden">
    <div style="font-size:10px;color:#ff0055;font-weight:900;text-align:center">⚠ ДРЕДНОУТ СИСТЕМЫ ⚠</div>
    <div class="bar-bg"><div class="bar-fill" id="bossHp" style="width:100%;background:linear-gradient(90deg,#ff0055,#ff9900)"></div></div>
  </div>
</div>
<div id="combatBar" class="hidden">
  <div class="wcard">
    <div style="font-size:10px;color:#ff007f;font-weight:800">ПЛАЗМА [F / ТАП]</div>
    <div class="bar-bg"><div class="bar-fill" id="wFill" style="width:100%;background:linear-gradient(90deg,#ff007f,#ffaa00)"></div></div>
  </div>
  <button id="fireBtn">🔥 ОГОНЬ</button>
</div>
<div id="menuScreen" class="screen">
  <div class="logo">CYBER RUNNER</div>
  <div class="sub" id="bestLbl">APEX EDITION • Лучший рекорд: 0 м</div>
  <div class="mgrid">
    <button class="bmain" id="btnPlay">▶ В БОЙ</button>
    <button class="bsub" onclick="UI.open('hangar')">🚀 Ангар</button>
    <button class="bsub" onclick="UI.open('missions')">🏆 Контракты</button>
    <button class="bsub" onclick="UI.open('records')">📊 ТОП-5</button>
    <button class="bsub" onclick="UI.open('settings')">⚙️ Настройки</button>
  </div>
</div>
<div id="modalScreen" class="screen hidden" style="z-index:40">
  <div class="panel">
    <div class="phead"><h2 id="mTitle" style="color:#00f3ff;font-size:18px">РАЗДЕЛ</h2><button class="bsub" style="padding:7px 14px" onclick="UI.close()">✕ Закрыть</button></div>
    <div id="mBody"></div>
  </div>
</div>
<div id="overScreen" class="screen hidden">
  <div class="logo" style="font-size:36px">КОРАБЛЬ РАЗБИТ</div>
  <div class="sub" id="sumTxt">Пройдено: 0 м • Заработано: +0 кредитов</div>
  <div class="mgrid">
    <button class="bmain" id="btnRetry">↻ ЕЩЁ РАЗ</button>
    <button class="bsub" id="btnRevive" style="border-color:#00ff88;color:#00ff88">⚡ Второй шанс</button>
    <button class="bsub" id="btnDouble" style="border-color:#ffd700;color:#ffd700">💰 Удвоить (x2)</button>
    <button class="bsub" style="grid-column:1/-1" onclick="UI.toMenu()">В главное меню</button>
  </div>
</div>
<script>
const SHIPS=[
  {id:'viper',name:'VIPER MK-1',price:0,c:0x00f3ff,w:0xff007f,spd:.56,b:1,d:'Базовый перехватчик'},
  {id:'phantom',name:'PHANTOM X',price:250,c:0xaa00ff,w:0x00ff88,spd:.62,b:1.15,d:'Двойные кили (+15% кр.)'},
  {id:'titan',name:'TITAN HEAVY',price:600,c:0xffaa00,w:0xff2200,spd:.53,b:1.35,d:'Турбины (+35% кр.)'},
  {id:'omega',name:'OMEGA APEX',price:1400,c:0xffffff,w:0x00f3ff,spd:.66,b:1.6,d:'Энерго-нимб (+60% кр.)'}
];
const SECTORS=[
  {d:0,n:'СЕКТОР 01: НЕОНОВЫЙ ГОРОД',f:0x03040a,g:0xff007f},
  {d:400,n:'СЕКТОР 02: КИБЕР-ПУСТОШЬ',f:0x120505,g:0xff5500},
  {d:900,n:'СЕКТОР 03: МАТРИЦА ЯДРА',f:0x021208,g:0x00ff66},
  {d:1500,n:'СЕКТОР 04: СИНГУЛЯРНОСТЬ',f:0x0d0218,g:0xaa00ff}
];
let Save=Object.assign({coins:150,best:0,top:[],tot:0,boss:0,clm:[],ship:'viper',owned:['viper'],upg:{mag:0,shd:0,pls:0},hq:true},JSON.parse(localStorage.getItem('APEX_V4')||'{}'));
function sync(){
  localStorage.setItem('APEX_V4',JSON.stringify(Save));
  document.getElementById('uiCoins').innerText=Save.coins;
  document.getElementById('bestLbl').innerText=`APEX EDITION • Рекорд: ${Math.floor(Save.best)} м`;
}
sync();

let St={play:false,pause:false,dist:0,coins:0,spd:.56,lane:1,vy:0,gnd:true,en:100,shd:0,nitro:0,shk:0,rev:false,dbl:false,cmb:0,cmbT:0,nBoss:400,boss:null,bHp:0};

const AdsGateway={
  ysdk:null,
  init(){if(window.YaGames)window.YaGames.init().then(s=>{this.ysdk=s;s.features.LoadingAPI?.ready()}).catch(()=>{})},
  show(cb){
    if(this.ysdk?.adv){this.ysdk.adv.showRewardedVideo({callbacks:{onRewarded:cb,onError:cb}});return}
    const b=document.createElement('div');b.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#00f3ff;font-size:22px;font-weight:900';
    let s=3;b.innerHTML=`<div>ПОЛУЧЕНИЕ НАГРАДЫ...</div><div id="adS" style="font-size:48px;color:#ffd700;margin-top:10px">${s}</div>`;document.body.appendChild(b);
    const t=setInterval(()=>{s--;const e=document.getElementById('adS');if(e)e.innerText=s;if(s<=0){clearInterval(t);b.remove();cb()}},1000);
  }
};
AdsGateway.init();

const AudioSys={
  ctx:null,muted:false,step:0,
  bass:[65.41,65.41,77.78,65.41,87.31,87.31,98,77.78],
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()},
  sfx(tp){
    if(this.muted)return;this.init();
    const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);
